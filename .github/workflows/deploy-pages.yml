name: Validate and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_PUSH_API_URL: https://crux-meal-reminders.crayjake.workers.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Validate canonical nutrition data
        run: npm run validate:data

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Install mobile WebKit
        run: npx playwright install --with-deps webkit

      - name: Mobile and base-path tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_BASE_PATH: /preview

      - name: Build static export
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static export
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
